<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بانک سؤالات تفسیر موضوعی قرآن — ویژهٔ برادران | HumsYar</title>
<style>
:root{
  --navy:#172a4c; --navy2:#1e3e6e; --teal:#006064; --teal2:#008080;
  --gold:#f0ad1e; --cream:#fbf6e9; --goldtext:#6e5414;
  --bg:#f4f6f9; --card:#ffffff; --ink:#1e242d; --muted:#5a626e;
  --line:#dde4ec; --ok:#1e7e34; --okbg:#e6f4ea; --bad:#b0342c; --badbg:#fceeec;
  --shadow:0 2px 10px rgba(23,42,76,.08);
}
html[data-theme="dark"]{
  --bg:#0f1624; --card:#19233a; --ink:#e8edf5; --muted:#9aa7bd;
  --line:#2a3a58; --okbg:#143422; --badbg:#3a1b18; --cream:#2a2a1e;
  --goldtext:#e8c565; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Vazirmatn","Vazir","IRANSans",Tahoma,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.9}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  padding:14px 18px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
header .bar{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
header h1{font-size:16px;margin:0;flex:1;font-weight:800}
header .gold{height:4px;background:var(--gold);margin:-14px -18px 12px}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  border-radius:9px;padding:6px 11px;cursor:pointer;font-family:inherit;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.22)}
.layout{display:flex;max-width:1100px;margin:0 auto;gap:16px;padding:16px}
nav#side{width:250px;flex-shrink:0}
nav#side .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px;margin-bottom:12px;box-shadow:var(--shadow)}
nav#side h3{font-size:13px;color:var(--teal2);margin:4px 8px 6px}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:right;border:none;
  background:none;color:var(--ink);font-family:inherit;font-size:14px;padding:8px 10px;
  border-radius:9px;cursor:pointer}
.navitem:hover{background:var(--bg)}
.navitem.active{background:var(--teal);color:#fff}
.navitem .cnt{margin-right:auto;background:var(--bg);color:var(--muted);border-radius:99px;
  padding:0 8px;font-size:12px}
.navitem.active .cnt{background:rgba(255,255,255,.2);color:#fff}
main{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.notice{border-right:4px solid var(--gold);background:var(--cream);color:var(--goldtext);
  border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.q-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.badge{font-size:11.5px;border-radius:99px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.badge.catA{background:var(--okbg);color:var(--ok);border-color:transparent}
.badge.catB{background:var(--cream);color:var(--goldtext);border-color:transparent}
.badge.d1{color:var(--ok)} .badge.d3{color:var(--bad)}
.star{margin-right:auto;background:none;border:none;font-size:19px;cursor:pointer;color:var(--muted)}
.star.on{color:var(--gold)}
.qtext{font-weight:700;margin:4px 0 12px;font-size:15.5px}
.opt{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:right;font-family:inherit;
  font-size:14.5px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);
  border-radius:11px;padding:9px 12px;margin:6px 0;cursor:pointer;transition:.15s;line-height:1.8}
.opt:hover:not(:disabled){border-color:var(--teal2)}
.opt:disabled{cursor:default;opacity:.92}
.opt .k{font-weight:800;color:var(--teal2);flex-shrink:0}
.opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt .mark{margin-right:auto;font-weight:900}
.expl{display:none;margin-top:10px;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.expl.show{display:block;animation:fad .25s}
@keyframes fad{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.expl .head{padding:7px 13px;font-weight:800;font-size:13.5px;color:#fff}
.expl.ok .head{background:var(--ok)} .expl.bad .head{background:var(--bad)}
.expl .body{padding:11px 13px;font-size:13.8px;background:var(--card)}
.expl .row{margin:5px 0}
.expl .lbl{font-weight:800;color:var(--teal2)}
.expl .src{color:var(--muted);font-size:12.5px;border-top:1px dashed var(--line);padding-top:7px;margin-top:8px}
.retry{margin-top:9px;background:none;border:1px solid var(--line);color:var(--muted);
  font-family:inherit;border-radius:9px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.retry:hover{color:var(--teal2);border-color:var(--teal2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search], .toolbar select{font-family:inherit;font-size:13.5px;
  padding:7px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:150px}
.btn{background:var(--teal);color:#fff;border:none;font-family:inherit;font-size:14px;
  border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--teal2)}
.btn.gold{background:var(--gold);color:#3c2d05}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--teal2)}
.pbar{height:9px;background:var(--bg);border-radius:99px;overflow:hidden;margin:6px 0}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold))}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{border:1px solid var(--line);padding:6px 9px;text-align:right}
table.rep th{background:var(--bg);color:var(--teal2)}
footer{color:var(--muted);text-align:center;font-size:12.5px;padding:18px}
#menuBtn{display:none}
.examset{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.examset label{font-size:13.5px;color:var(--muted)}
.score{font-size:17px;font-weight:800;text-align:center;margin:8px 0}
@media(max-width:820px){
  #menuBtn{display:inline-block}
  nav#side{position:fixed;inset:0 0 0 auto;width:270px;background:var(--bg);z-index:100;
    padding:14px;overflow:auto;transform:translateX(100%);transition:.25s}
  nav#side.open{transform:none;box-shadow:-4px 0 30px rgba(0,0,0,.3)}
  .layout{padding:10px}
}
</style>

  <div class="gold"></div>
  <div class="bar">
    <button id="menuBtn" class="hbtn">☰</button>

</nav>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const QS = DATA.questions;
const byId = Object.fromEntries(QS.map(q=>[q.id,q]));
const LSKEY='tafsir_bank_v1';
let store = {}; try{ store = JSON.parse(localStorage.getItem(LSKEY))||{}; }catch(e){ store={}; }
store.answers = store.answers||{};   // id -> {picked, ok}
store.marks = store.marks||[];
store.theme = store.theme||'light';
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(store)); }catch(e){} }

/* ---------- theme ---------- */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(){ document.documentElement.dataset.theme=store.theme;
  themeBtn.textContent = store.theme==='dark'?'☀️':'🌙'; }
themeBtn.onclick=()=>{ store.theme=store.theme==='dark'?'light':'dark'; save(); applyTheme(); };
applyTheme();

/* ---------- nav ---------- */
const side=document.getElementById('side');
document.getElementById('menuBtn').onclick=()=>side.classList.toggle('open');
const SECTIONS=[
  {id:'all',   t:'📚 مطالعهٔ همهٔ سؤالات', f:()=>QS},
  {id:'exam',  t:'📝 آزمون تصادفی', f:null},
  {id:'catA',  t:'✅ سؤالات قطعی (دستهٔ A)', f:()=>QS.filter(q=>q.category==='A')},
  {id:'catB',  t:'💡 سؤالات مفهومی (دستهٔ B)', f:()=>QS.filter(q=>q.category==='B')},
  {id:'wrong', t:'❌ اشتباهات من', f:()=>QS.filter(q=>store.answers[q.id] && !store.answers[q.id].ok)},
  {id:'mark',  t:'⭐ نشان‌شده‌ها', f:()=>QS.filter(q=>store.marks.includes(q.id))},
  {id:'prog',  t:'📊 گزارش پیشرفت', f:null},
];
let current={type:'sura', key:'حمد'};

  const sn=document.getElementById('suraNav'); sn.innerHTML='';

    const b=document.createElement('button'); b.className='navitem';

    b.onclick=()=>{ current={type:'sura',key:s.name}; render(); };
    sn.appendChild(b);
  });
  const cn=document.getElementById('secNav'); cn.innerHTML='';
  SECTIONS.forEach(s=>{
    const b=document.createElement('button'); b.className='navitem';
    if(current.type==='sec'&&current.key===s.id) b.classList.add('active');
    const n = s.f? s.f().length : null;
    b.innerHTML=`${s.t} ${n!==null?`<span class="cnt">${fa(n)}</span>`:''}`;
    b.onclick=()=>{ current={type:'sec',key:s.id}; render(); };
    cn.appendChild(b);
  });
}
function fa(n){ return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }

/* ---------- question card ---------- */
function qCard(q, opts){
  opts=opts||{};
  const card=document.createElement('div'); card.className='card'; card.dataset.qid=q.id;
  const st=store.answers[q.id];
  const head=document.createElement('div'); head.className='q-head';
  head.innerHTML=
    `<span class="badge ${q.category==='A'?'catA':'catB'}">${q.category==='A'?'قطعی A':'مفهومی B'}</span>`+
    `<span class="badge">${q.topic}</span>`+
    `<span class="badge ${q.difficulty==='آسان'?'d1':q.difficulty==='دشوار'?'d3':''}">${q.difficulty}</span>`+
    (opts.num?`<span class="badge">سؤال ${fa(opts.num)}</span>`:'');
  const star=document.createElement('button'); star.className='star'+(store.marks.includes(q.id)?' on':'');
  star.textContent='★'; star.title='نشان کردن';
  star.onclick=()=>{ const i=store.marks.indexOf(q.id);
    if(i<0) store.marks.push(q.id); else store.marks.splice(i,1);
    star.classList.toggle('on'); save(); drawNav(); };
  head.appendChild(star); card.appendChild(head);
  const qt=document.createElement('div'); qt.className='qtext'; qt.textContent=q.question;
  card.appendChild(qt);

  const expl=document.createElement('div'); expl.className='expl';
  const correctOpt=q.options.find(o=>o.key===q.answer);
  expl.innerHTML=`<div class="head"></div><div class="body">
    <div class="row"><span class="lbl">پاسخ صحیح: </span>گزینهٔ ${q.answer}) ${correctOpt.text}</div>
    <div class="row"><span class="lbl">دلیل: </span>${q.explanation.reason}</div>
    <div class="row"><span class="lbl">نکتهٔ جزوه: </span>${q.explanation.booklet_note}</div>
    ${q.exam_source?`<div class="row"><span class="lbl">منبع آزمون (تفسیر نور): </span>${q.exam_source.status}${q.exam_source.evidence?` — «${q.exam_source.evidence}»`:''}</div>`:''}
    <div class="src">📖 منبع: ${q.explanation.source} · اعتبارسنجی: ${q.validation}</div>
    <button class="retry">🔄 تمرین مجدد</button></div>`;

  const btns=[];
  q.options.forEach(o=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="k">${o.key})</span><span>${o.text}</span><span class="mark"></span>`;
    b.onclick=()=>answer(q,o.key,btns,expl,opts.onAnswer, opts.deferFeedback);
    btns.push({b,key:o.key}); card.appendChild(b);
  });
  card.appendChild(expl);
  expl.querySelector('.retry').onclick=()=>{
    delete store.answers[q.id]; save(); drawNav();
    btns.forEach(x=>{x.b.disabled=false;x.b.className='opt';x.b.querySelector('.mark').textContent='';});
    expl.className='expl';
  };
  if(st && !opts.fresh) paint(q, st.picked, btns, expl, !!opts.deferFeedback && !opts.reveal);
  return card;
}
function paint(q,picked,btns,expl,hide){
  btns.forEach(x=>{
    x.b.disabled=true;
    if(hide){ if(x.key===picked){x.b.classList.add(picked===q.answer?'correct':'wrong');
      x.b.querySelector('.mark').textContent='•';} return; }
    if(x.key===q.answer){ x.b.classList.add('correct'); x.b.querySelector('.mark').textContent='✓'; }
    if(x.key===picked && picked!==q.answer){ x.b.classList.add('wrong'); x.b.querySelector('.mark').textContent='✗'; }
  });
  if(!hide){
    const ok=picked===q.answer;
    expl.classList.add('show', ok?'ok':'bad');
    expl.querySelector('.head').textContent= ok?'✓ آفرین! پاسخ درست است':'✗ پاسخ نادرست — پاسخ صحیح را ببینید';
  }
}
function answer(q,picked,btns,expl,cb,defer){
  if(store.answers[q.id] && btns[0].b.disabled) return;
  const ok=picked===q.answer;
  store.answers[q.id]={picked, ok}; save();
  paint(q,picked,btns,expl,!!defer);
  drawNav();
  if(cb) cb(q,ok);
}

/* ---------- views ---------- */
const main=document.getElementById('main');
function render(){
  side.classList.remove('open');
  drawNav(); main.innerHTML='';
  if(current.type==='sura') return viewSura(current.key);
  if(current.key==='exam') return viewExamSetup();
  if(current.key==='prog') return viewProgress();
  const sec=SECTIONS.find(s=>s.id===current.key);
  viewList(sec.t, sec.f(), current.key==='wrong'?'هنوز پاسخ اشتباهی ثبت نشده است. 🎉':
    current.key==='mark'?'هنوز سؤالی را نشان نکرده‌اید. روی ★ هر سؤال بزنید.':'سؤالی در این بخش نیست.');
}
function viewSura(name){
  const s=DATA.meta.suras.find(x=>x.name===name);
  if(!s.count){
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<h2 style="margin:0 0 8px;color:var(--teal2);font-size:17px">سورهٔ ${name}</h2>
      <div class="notice">⚠️ ${s.note}<br>این وضعیت در گزارش پوشش (coverage_report.md) ثبت شده است؛ طبق قاعدهٔ پروژه،
      هیچ سؤالی ساخته یا اضافه نشده است. برای مرور این سوره به جزوهٔ تفسیر موضوعی (ویژهٔ برادران) مراجعه کنید.</div>`;
    main.appendChild(c); return;
  }
  viewList(`سورهٔ ${name}`, QS.filter(q=>q.sura===name));
}
function viewList(title, items, emptyMsg){
  const bar=document.createElement('div'); bar.className='card toolbar';
  bar.innerHTML=`<strong style="color:var(--teal2)">${title}</strong>
    <input type="search" id="srch" placeholder="جست‌وجو در متن سؤال و گزینه‌ها…">
    <select id="fTopic"><option value="">همهٔ مباحث</option></select>
    <select id="fDiff"><option value="">هر دشواری</option><option>آسان</option><option>متوسط</option><option>دشوار</option></select>
    <select id="fSt"><option value="">هر وضعیتی</option><option value="un">پاسخ‌نداده</option>
      <option value="ok">درست جواب‌داده</option><option value="bad">غلط جواب‌داده</option></select>`;
  main.appendChild(bar);
  const topics=[...new Set(items.map(q=>q.topic))];
  const tSel=bar.querySelector('#fTopic');
  topics.forEach(t=>{const o=document.createElement('option');o.textContent=t;tSel.appendChild(o);});
  const list=document.createElement('div'); main.appendChild(list);
  function refresh(){
    list.innerHTML='';
    const s=bar.querySelector('#srch').value.trim();
    const ft=tSel.value, fd=bar.querySelector('#fDiff').value, fs=bar.querySelector('#fSt').value;
    let shown=0;
    items.forEach((q,i)=>{
      if(ft && q.topic!==ft) return;
      if(fd && q.difficulty!==fd) return;
      const st=store.answers[q.id];
      if(fs==='un'&&st) return;
      if(fs==='ok'&&!(st&&st.ok)) return;
      if(fs==='bad'&&!(st&&!st.ok)) return;
      if(s && !(q.question+q.options.map(o=>o.text).join(' ')).includes(s)) return;
      shown++; list.appendChild(qCard(q,{num:i+1,onAnswer:null}));
    });
    if(!shown){ const c=document.createElement('div'); c.className='card';
      c.innerHTML=`<div class="notice">${items.length? 'موردی مطابق فیلترها یافت نشد.' : (emptyMsg||'سؤالی نیست.')}</div>`;
      list.appendChild(c); }
  }
  ['input','change'].forEach(ev=>bar.addEventListener(ev,refresh));
  refresh();
}
/* ---------- exam ---------- */
function viewExamSetup(){
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h2 style="margin:0 0 6px;color:var(--teal2);font-size:17px">📝 آزمون تصادفی</h2>
  <p style="color:var(--muted);font-size:13.5px;margin:4px 0 10px">سؤالات به‌صورت تصادفی از بانک (سورهٔ حمد — ${fa(QS.length)} سؤال) انتخاب می‌شوند.</p>
  <div class="examset">
    <label>تعداد سؤال:</label>
    <select id="exN"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select>
    <label>دسته:</label>
    <select id="exCat"><option value="">قطعی + مفهومی</option><option value="A">فقط قطعی (A)</option><option value="B">فقط مفهومی (B)</option></select>
    <label>نمایش پاسخ:</label>
    <select id="exFb"><option value="now" selected>بلافاصله بعد از هر سؤال</option><option value="end">در پایان آزمون</option></select>
  </div>
  <button class="btn gold" id="exGo">شروع آزمون</button>`;
  main.appendChild(c);
  c.querySelector('#exGo').onclick=()=>{
    const n=+c.querySelector('#exN').value, cat=c.querySelector('#exCat').value,
          fb=c.querySelector('#exFb').value;
    let pool=QS.filter(q=>!cat||q.category===cat);
    pool=pool.slice().sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));
    runExam(pool, fb==='end');
  };
}
function runExam(pool, defer){
  main.innerHTML='';
  const head=document.createElement('div'); head.className='card';
  head.innerHTML=`<div class="score" id="exStat">آزمون: ${fa(pool.length)} سؤال</div><div class="pbar"><div id="exBar" style="width:0%"></div></div>`;
  main.appendChild(head);
  let done=0, right=0; const answered={};
  const finishBox=document.createElement('div');
  pool.forEach((q,i)=>{
    main.appendChild(qCard(q,{num:i+1, fresh:true, deferFeedback:defer, onAnswer:(qq,ok)=>{
      if(answered[qq.id]) return; answered[qq.id]=true;
      done++; if(ok) right++;
      document.getElementById('exBar').style.width=(done/pool.length*100)+'%';
      document.getElementById('exStat').textContent =
        defer? `پاسخ‌داده: ${fa(done)} از ${fa(pool.length)}`
             : `پاسخ‌داده: ${fa(done)} از ${fa(pool.length)} — درست: ${fa(right)}`;
      if(done===pool.length) finish();
    }}));
  });
  const endBtn=document.createElement('div'); endBtn.className='card';
  endBtn.innerHTML=`<button class="btn ghost" id="exEnd">پایان و نمایش کارنامه</button>`;
  main.appendChild(endBtn); main.appendChild(finishBox);
  endBtn.querySelector('#exEnd').onclick=finish;
  function finish(){
    const pct=done?Math.round(right/done*100):0;
    finishBox.className='card';
    finishBox.innerHTML=`<div class="score">نتیجهٔ آزمون: ${fa(right)} درست از ${fa(done)} پاسخ (${fa(pct)}٪)</div>
      <div class="pbar"><div style="width:${pct}%"></div></div>
      ${defer?'<div class="notice">پاسخ‌های صحیح و توضیحات اکنون زیر هر سؤال نمایش داده شد.</div>':''}
      <button class="btn" id="agn">آزمون جدید</button>`;
    if(defer){
      document.querySelectorAll('#main .card[data-qid]').forEach(cd=>{
        const q=byId[cd.dataset.qid]; const st=store.answers[q.id]; if(!st) return;
        const fresh=qCard(q,{reveal:true}); cd.replaceWith(fresh);
      });
      finishBox.scrollIntoView({behavior:'smooth'});
    }
    finishBox.querySelector('#agn').onclick=()=>{ current={type:'sec',key:'exam'}; render(); };
    window.scrollTo({top:finishBox.offsetTop-80, behavior:'smooth'});
  }
}
/* ---------- progress ---------- */
function viewProgress(){
  const ans=Object.entries(store.answers);
  const right=ans.filter(([,v])=>v.ok).length;
  const c=document.createElement('div'); c.className='card';
  const pct=ans.length?Math.round(right/ans.length*100):0;
  const cov=Math.round(ans.length/QS.length*100);
  c.innerHTML=`<h2 style="margin:0 0 8px;color:var(--teal2);font-size:17px">📊 گزارش پیشرفت</h2>
  <div class="statgrid">
    <div class="stat"><b>${fa(QS.length)}</b>کل سؤالات بانک</div>
    <div class="stat"><b>${fa(ans.length)}</b>پاسخ‌داده</div>
    <div class="stat"><b>${fa(right)}</b>پاسخ درست</div>
    <div class="stat"><b>${fa(pct)}٪</b>درصد صحت</div>
    <div class="stat"><b>${fa(store.marks.length)}</b>نشان‌شده</div>
  </div>
  <div style="font-size:13px;color:var(--muted)">پوشش بانک: ${fa(cov)}٪</div>
  <div class="pbar"><div style="width:${cov}%"></div></div>
  <h3 style="color:var(--teal2);font-size:14px">عملکرد به تفکیک مبحث جزوه</h3>
  <table class="rep"><tr><th>مبحث</th><th>پاسخ‌داده</th><th>درست</th><th>درصد</th></tr>
  ${[...new Set(QS.map(q=>q.topic))].map(t=>{
    const qs=QS.filter(q=>q.topic===t);
    const a=qs.filter(q=>store.answers[q.id]);
    const r=a.filter(q=>store.answers[q.id].ok);
    const p=a.length?Math.round(r.length/a.length*100):0;
    return `<tr><td>${t}</td><td>${fa(a.length)} از ${fa(qs.length)}</td><td>${fa(r.length)}</td><td>${a.length?fa(p)+'٪':'—'}</td></tr>`;
  }).join('')}</table>
  <div style="margin-top:14px"><button class="btn ghost" id="rst">🗑 پاک‌کردن کل پیشرفت</button></div>`;
  main.appendChild(c);
  c.querySelector('#rst').onclick=()=>{
    if(confirm('همهٔ پاسخ‌ها و نشان‌ها پاک شود؟')){ store.answers={}; store.marks=[]; save(); render(); }
  };
}
render();
</script>
</body>
